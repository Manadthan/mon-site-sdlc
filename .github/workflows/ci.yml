name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un nouveau push sur la même PR annule la vérification précédente, devenue inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifications:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Tests e2e (iPhone 12 mini)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Supabase écoute sur des ports fixes (54320-54329), situés dans la plage des ports temporaires
      # que Linux attribue aux connexions sortantes (32768-60999) : pendant le téléchargement des images,
      # l'un d'eux peut déjà être pris (« address already in use »). On déplace cette plage au-dessus.
      - name: Libérer les ports de Supabase
        run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65000"
      # Base Supabase locale et jetable (connexion US-01) : jamais la base de production.
      - run: npx supabase start
      - name: Variables de la base locale
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/supabase.env"
          echo "Variables disponibles :" && cut -d= -f1 "$RUNNER_TEMP/supabase.env"
          set -a && . "$RUNNER_TEMP/supabase.env" && set +a
          publishable="${PUBLISHABLE_KEY:-$ANON_KEY}"
          secret="${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          if [ -z "$API_URL" ] || [ -z "$publishable" ] || [ -z "$secret" ]; then
            echo "::error::Clés de la base locale introuvables dans supabase status" && exit 1
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publishable"
            echo "E2E_SUPABASE_SECRET_KEY=$secret"
          } >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  base-de-donnees:
    name: Base de données (migrations, RLS, types)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Supabase écoute sur des ports fixes (54320-54329), situés dans la plage des ports temporaires
      # que Linux attribue aux connexions sortantes (32768-60999) : pendant le téléchargement des images,
      # l'un d'eux peut déjà être pris (« address already in use »). On déplace cette plage au-dessus.
      - name: Libérer les ports de Supabase
        run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65000"
      # Base Supabase locale et jetable : les migrations y sont appliquées depuis zéro.
      - run: npx supabase db start
      - name: Tests pgTAP (schéma et Row Level Security)
        run: npm run db:test
      - name: Types TypeScript à jour avec le schéma
        run: |
          # Le générateur produit un fichier non formaté : on le passe par Prettier, comme npm run db:types.
          npx supabase gen types typescript --schema public \
            | npx prettier --stdin-filepath src/types/database.ts > "$RUNNER_TEMP/database.ts"
          if ! diff -u src/types/database.ts "$RUNNER_TEMP/database.ts"; then
            echo "::error::src/types/database.ts n'est pas à jour : lancer npm run db:types"
            exit 1
          fi
