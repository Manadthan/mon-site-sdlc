name: Déploiement du schéma

# Applique les migrations de supabase/migrations/ à la base de production.
# Le dépôt est la seule source de vérité du schéma : on ne modifie jamais la base à la main.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-db.yml"
  # Bouton « Run workflow » dans l'onglet Actions.
  workflow_dispatch:

# Jamais deux déploiements en même temps, et jamais d'annulation en cours de route.
concurrency:
  group: deploy-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrations:
    name: Appliquer les migrations (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Vérifier les secrets
        run: |
          manquants=""
          for nom in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!nom}" ]; then manquants="$manquants $nom"; fi
          done
          if [ -n "$manquants" ]; then
            echo "::error::Secret(s) GitHub manquant(s) :$manquants (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Depuis la v3 de la CLI, les commandes visent la base locale par défaut :
      # --remote=<ref> désigne explicitement la base de production.
      - name: État des migrations en production
        run: npx supabase migration list --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Appliquer les migrations
        run: npx supabase db push --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
